name: access-site

# Tests, provisions and deploys access.modelcontextprotocol.io (access-site/).
# The Worker bundles src/config, so config changes redeploy it too.
on:
  pull_request:
    paths:
      - 'access-site/**'
      - 'src/config/**'
      - '.github/workflows/access-site.yml'
  push:
    branches:
      - main
    paths:
      - 'access-site/**'
      - 'src/config/**'
      - '.github/workflows/access-site.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Typecheck and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: access-site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: access-site/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  deploy:
    name: Provision and deploy
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-access-site
      cancel-in-progress: false
    defaults:
      run:
        working-directory: access-site
    env:
      # Token scoped to: Workers Scripts edit, D1 edit, and Workers Routes /
      # DNS edit on the modelcontextprotocol.io zone (for the custom domain).
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_ACCESS_SITE_TOKEN }}
      OIDC_SIGNING_KEY: ${{ secrets.ACCESS_SITE_OIDC_SIGNING_KEY }}
      OIDC_CLIENT_SECRET: ${{ secrets.ACCESS_SITE_OIDC_CLIENT_SECRET }}
      GITHUB_CLIENT_SECRET: ${{ secrets.ACCESS_SITE_GITHUB_CLIENT_SECRET }}
      OIDC_PREVIOUS_JWK: ${{ secrets.ACCESS_SITE_OIDC_PREVIOUS_JWK }}
    steps:
      - uses: actions/checkout@v4
      - name: Check setup
        id: setup
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$OIDC_SIGNING_KEY" ] || [ -z "$OIDC_CLIENT_SECRET" ]; then
            echo "::notice::access-site is not set up yet (see access-site/README.md); skipping deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.setup.outputs.ready == 'true'
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: access-site/package-lock.json
      - if: steps.setup.outputs.ready == 'true'
        run: npm ci
      - if: steps.setup.outputs.ready == 'true'
        run: ./scripts/deploy.sh

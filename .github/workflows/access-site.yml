name: access-site

# Tests and deploys access.modelcontextprotocol.io (access-site/). The Worker
# bundles src/config, so config changes redeploy it too.
on:
  pull_request:
    paths:
      - 'access-site/**'
      - 'src/config/**'
      - '.github/workflows/access-site.yml'
  push:
    branches:
      - main
    paths:
      - 'access-site/**'
      - 'src/config/**'
      - '.github/workflows/access-site.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Typecheck and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: access-site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: access-site/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  deploy:
    name: Deploy
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-access-site
      cancel-in-progress: false
    defaults:
      run:
        working-directory: access-site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: access-site/package-lock.json
      - run: npm ci
      # Token scoped to: Workers Scripts edit, D1 edit, and Workers Routes /
      # DNS edit on the modelcontextprotocol.io zone (for the custom domain).
      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_ACCESS_SITE_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply access-site --remote
      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_ACCESS_SITE_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  PULUMI_VERSION: "3.197.0"

jobs:
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Pulumi
        uses: pulumi/actions@v6
        with:
          pulumi-version: ${{ env.PULUMI_VERSION }}

      - name: Cache Pulumi plugins
        uses: actions/cache@v4
        with:
          path: ~/.pulumi/plugins
          key: pulumi-plugins-${{ hashFiles('Pulumi.yaml') }}
          restore-keys: |
            pulumi-plugins-

      - name: Install Pulumi packages
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pulumi install

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_PROD_SERVICE_ACCOUNT_KEY }}

      - name: Deploy to Production
        env:
          PULUMI_PASSPHRASE: ${{ secrets.PULUMI_PROD_PASSPHRASE }}
          GITHUB_TOKEN: ${{ secrets.PULUMI_GITHUB_TOKEN }}
          ORG_BILLING_EMAIL: ${{ secrets.ORG_BILLING_EMAIL }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
          CLOUDFLARE_ROLE_MANAGEMENT_TOKEN: ${{ secrets.CLOUDFLARE_ROLE_MANAGEMENT_TOKEN }}
        run: |
          echo "$PULUMI_PASSPHRASE" > passphrase.prod.txt
          export PULUMI_CONFIG_PASSPHRASE_FILE=passphrase.prod.txt
          pulumi login gs://mcp-access-prod-pulumi-state
          pulumi config set discord:guildId "$DISCORD_GUILD_ID" --stack prod
          pulumi config set discord:botToken "$DISCORD_BOT_TOKEN" --secret --stack prod
          pulumi config set githubBillingEmail "$ORG_BILLING_EMAIL" --secret --stack prod
          # Cloudflare Access is optional until the CLOUDFLARE_ROLE_MANAGEMENT_TOKEN secret exists
          if [ -n "$CLOUDFLARE_ROLE_MANAGEMENT_TOKEN" ]; then
            pulumi config set cloudflare:roleManagementToken "$CLOUDFLARE_ROLE_MANAGEMENT_TOKEN" --secret --stack prod
          fi
          # TEMP: one-time state surgery so Pulumi stops managing clare@'s Workspace
          # user (existingGWSUser in src/config/users.ts). Deploy runs #289 and #290
          # (2026-10-05) fail in the refresh pass of `make up` because Google returns
          # 400 on users.get for the stored gws-user-clare resource although the
          # account is active. With the flag set, the program no longer declares
          # gws-user-clare or its gws-pwd-clare RandomPassword, so both MUST leave
          # state before `make up`, or Pulumi plans a real users.delete.
          # `pulumi state delete` is not usable here: clare's GroupMember records list
          # the User in their dependencies, so it refuses without --target-dependents
          # (which would also drop the memberships from state). Instead: export the
          # state, remove both entries, strip their URNs from every remaining
          # resource's dependencies, and re-import. Deliberately NOT `|| true`-guarded:
          # a failed surgery must fail the deploy loudly rather than let `make up`
          # delete the real account. Idempotent: if neither entry is in state, the
          # import is skipped. Remove this block after the next green deploy.
          STALE_URNS='[
            "urn:pulumi:prod::mcp-access::googleworkspace:index/user:User::gws-user-clare",
            "urn:pulumi:prod::mcp-access::random:index/randomPassword:RandomPassword::gws-pwd-clare"
          ]'
          pulumi stack export --stack prod --file /tmp/state.json
          jq --argjson urns "$STALE_URNS" '
            def drop_stale: map(select(. as $d | ($urns | index($d)) | not));
            .deployment.resources |= (
              map(select(.urn as $u | ($urns | index($u)) | not))
              | map(
                  (if .dependencies then .dependencies |= drop_stale else . end)
                  | (if .propertyDependencies then .propertyDependencies |= map_values(drop_stale) else . end)
                )
            )' /tmp/state.json > /tmp/state-repaired.json
          before=$(jq '.deployment.resources | length' /tmp/state.json)
          after=$(jq '.deployment.resources | length' /tmp/state-repaired.json)
          echo "State surgery: removing $((before - after)) stale gws-user-clare/gws-pwd-clare entries"
          if [ "$before" -eq "$after" ]; then
            echo "No matching entries in state (already removed); skipping import"
          else
            pulumi stack import --stack prod --file /tmp/state-repaired.json
          fi
          make up
